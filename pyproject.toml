[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-extract-skill"
version = "0.1.0"
description = "Tencent Cloud powered Mandarin audio localization for authorized video"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
tencent = [
  "tencentcloud-sdk-python-common>=3.0.1482,<4",
  "tencentcloud-sdk-python-asr>=3.0.1482,<4",
  "tencentcloud-sdk-python-tts>=3.0.1482,<4",
]
test = ["pytest>=8,<9"]

[project.scripts]
video-localize = "video_extract_skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_extract_skill"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["live: calls real Tencent Cloud APIs and consumes quota"]
